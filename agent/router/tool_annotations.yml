# 工具路由注解：为从 flow_config 自动生成的 ToolEntry 补充
# 关键词（keyword 召回通道）、embedding 种子文本、以及 LLM 区分提示（tree_text）。
# 新增流程只需要改 flow_config/user_flows.yml；这里是可选的补充增强。
tools:
  order_status_query:
    keywords: ["查订单", "订单状态", "订单查询", "我的订单", "订单号", "查一下订单", "看看订单", "查查订单", "订单到哪了", "订单进度", "订单"]
    embed_text: ["查询订单状态", "我的订单现在什么状态", "查一下我的订单", "订单到哪一步了"]
    tree_text: "查询订单当前状态。区分：申请退款→refund_request；投诉/售后→ticket_submission；问退款规则→kb_refund_policy。"
  refund_request:
    keywords: ["退款", "退一下", "退钱", "申请退款", "我要退", "不想要了", "退款申请", "退掉", "退订单", "想退"]
    embed_text: ["申请退款", "我要退款", "订单不要了", "帮我退掉", "退钱", "想把这个订单退掉"]
    tree_text: "用户明确要求执行退款申请。区分：只问退款规则/能不能退→kb_refund_policy；查询退款进度→order_status_query；问怎么操作→guide。"
  ticket_submission:
    keywords: ["投诉", "工单", "找客服", "反馈", "举报", "问题反馈", "售后", "客服", "申诉", "维权"]
    embed_text: ["我要投诉", "提交工单", "反馈一个问题", "找人工客服处理", "售后问题"]
    tree_text: "提交投诉/工单，需要人工介入。区分：查询订单→order_status_query；申请退款→refund_request；要求真人→human_handoff。"
  course_consultation:
    keywords: ["课程", "咨询", "了解一下", "课程信息", "多少钱", "价格", "报名", "怎么学", "课程内容", "有哪些班", "课程介绍", "想了解课程"]
    embed_text: ["我想了解课程", "课程咨询", "这个课程怎么样", "课程多少钱", "都有什么课程"]
    tree_text: "查询课程系列信息（概述、适用人群、班次、价格）。区分：问课程体系/有哪些课→kb_course；问报名流程→kb_enrollment；问学习方式→kb_learning_style。"
  learning_progress_query:
    keywords: ["进度", "学习进度", "学得怎么样", "完成情况", "考勤", "作业", "视频完成", "考试成绩", "班次", "学习情况", "学到哪了"]
    embed_text: ["我的学习进度", "我在这个班次的学习情况", "学习进度查询", "我学到哪里了"]
    tree_text: "查询某个班次的多维度学习进度。区分：问课程信息→course_consultation；问订单→order_status_query。"
  human_handoff:
    keywords: ["转人工", "人工客服", "找人工", "真人客服", "人工", "真人", "转接人工"]
    embed_text: ["帮我转人工", "我要找人工客服", "转接人工"]
    tree_text: "用户明确要求人工介入。"
  kb_course:
    keywords: ["课程咨询", "课程有哪些", "有什么课程", "课程方向", "都有什么课程", "课程体系", "有哪些课程", "课程介绍"]
    embed_text: ["你们的课程涵盖哪些方向", "有哪些课程", "课程体系介绍"]
    tree_text: "回答课程体系/方向的静态知识。区分：用户要查具体课程的价格/班次/详情→course_consultation；想了解整个课程体系→本工具。"
  kb_enrollment:
    keywords: ["怎么报名", "报名流程", "如何报名", "怎么缴费", "怎么支付", "怎么开通", "报名", "如何缴费", "怎么买"]
    embed_text: ["报名流程是什么", "如何报名学习", "怎么缴费", "怎么开通学习账号"]
    tree_text: "回答报名/缴费流程。区分：用户想直接办理→对应 flow；只问流程→本工具。"
  kb_refund_policy:
    keywords: ["退款政策", "退款规则", "多久能退", "能退吗", "退款条件", "几天内退款", "退款期限", "退款规定", "怎么退", "退款流程"]
    embed_text: ["退款政策是什么", "开课多久能退", "退款规则", "能不能退"]
    tree_text: "回答退款政策/规则。区分：用户明确要执行退款→refund_request；只问怎么退→guide。"
  kb_learning_style:
    keywords: ["学习方式", "怎么上课", "直播还是录播", "上课形式", "回放", "怎么学习", "如何学习", "上课方式"]
    embed_text: ["学习方式是什么", "支持什么学习方式", "怎么上课"]
    tree_text: "回答学习方式（直播/录播/作业/考试）。"
  chitchat:
    keywords: ["你好", "您好", "嗨", "hello", "hi", "hey", "在吗", "谢谢", "再见", "拜拜", "哈哈", "嗯嗯", "好的", "没事", "随便", "你是谁", "晚安", "早上好", "下午好", "晚上好", "辛苦了", "哦", "嗯", "谢谢啦"]
    embed_text: ["你好呀", "在吗", "你是谁呀", "谢谢"]
    tree_text: "闲聊、打招呼、与业务无关的对话。"

services:
  mysql:
    image: mysql:8.0
    container_name: turncraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_prod}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: turncraft-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-18082}:18082"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
